<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE Hub | Nicholas Bagenda</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #050505;       
            --accent-cyan: #00E5FF;   
            --accent-red: #FF3B30;    
            --text-main: #FFFFFF;     
            --text-dim: #888888;     
            --glass: rgba(20, 20, 20, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER --- */
        header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }

        .logo { font-weight: 700; letter-spacing: 1px; }
        .live-badge {
            background: var(--accent-red);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            animation: pulse 2s infinite;
            margin-left: 10px;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* --- MAIN LAYOUT --- */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 350px; 
            gap: 0;
            height: calc(100vh - 60px);
        }

        /* --- LEFT: THE STAGE --- */
        .stage {
            position: relative;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #media-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        iframe, audio {
            width: 100%;
            height: 100%;
            border: none;
        }

        .overlay-info {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .current-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .current-desc {
            font-size: 1rem;
            color: #ccc;
            max-width: 600px;
        }

        .controls-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.2);
            z-index: 20;
        }
        
        .progress-fill {
            height: 100%;
            background: var(--accent-cyan);
            width: 0%;
            transition: width 0.5s linear;
        }

        /* --- RIGHT: THE QUEUE --- */
        .queue-panel {
            background: #111;
            border-left: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .queue-header {
            padding: 20px;
            font-weight: 600;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky;
            top: 0;
            background: #111;
            z-index: 5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .load-more-btn {
            background: transparent;
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .load-more-btn:hover { background: var(--accent-cyan); color: #000; }

        .queue-item {
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .queue-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .queue-item.active {
            background: rgba(0, 229, 255, 0.1);
            border-left: 3px solid var(--accent-cyan);
        }

        .thumb-placeholder {
            width: 60px;
            height: 40px;
            background: #333;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: #666;
            overflow: hidden;
        }
        
        .thumb-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-details h4 {
            font-size: 0.95rem;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        .item-details p {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        /* Mobile Adjustment */
        @media (max-width: 768px) {
            main {
                grid-template-columns: 1fr;
                grid-template-rows: 60vh 1fr; 
            }
            .queue-panel {
                border-left: none;
                border-top: 1px solid rgba(255,255,255,0.1);
            }
            .current-title { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">NICHOLAS<span style="color:var(--accent-cyan)">BAGENDA</span></div>
        <div class="live-indicator">
            <span class="live-badge">● LIVE FEED</span>
        </div>
        <a href="index.html" style="color:white; text-decoration:none; font-size:0.9rem;">Exit</a>
    </header>

    <main>
        <!-- LEFT: THE PLAYER STAGE -->
        <section class="stage">
            <div id="media-container"></div>
            
            <div class="overlay-info">
                <h2 class="current-title" id="display-title">Loading...</h2>
                <p class="current-desc" id="display-desc">Connecting to Guardian Stream...</p>
            </div>

            <div class="controls-bar">
                <div class="progress-fill" id="progress-bar"></div>
            </div>
        </section>

        <!-- RIGHT: THE CONTENT QUEUE -->
        <aside class="queue-panel">
            <div class="queue-header">
                Up Next 
                <button class="load-more-btn" onclick="fetchMoreVideos()">+ Load More</button>
            </div>
            <div id="queue-list"></div>
        </aside>
    </main>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        
        // 1. Your Hardcoded Core Playlist (Always loads first)
        const corePlaylist = [
            {
                id: 1, type: 'video',
                src: 'https://www.youtube.com/embed/iD67VqeTdkE?autoplay=1&mute=0&rel=0&modestbranding=1',
                title: 'SDA Ministry Message 1', desc: 'Powerful teaching on Grace.', thumbIcon: '▶️'
            },
            {
                id: 2, type: 'video',
                src: 'https://www.youtube.com/embed/_yV7zniQs4g?autoplay=1&mute=0&rel=0&modestbranding=1',
                title: 'Worship Session Live', desc: 'Presence of God through praise.', thumbIcon: '🎵'
            },
            {
                id: 3, type: 'audio',
                src: 'https://open.spotify.com/embed/playlist/5KpUf3Ys4G60aM8toOOh55?utm_source=generator&theme=0',
                title: 'SDA Worship Collection', desc: 'Curated hymns.', thumbIcon: '🎧'
            }
        ];

        // 2. YouTube API Settings
        const YT_API_KEY = "AIzaSyBqQ0wS7u0LBo5XxO-ij8hMfmt8-CHAcAk"; 
        
        // We are using the PLAYLIST ID now for better curation control
        const TARGET_PLAYLIST_ID = "PLZ6afNou8CGsKAM7HvLVu0A47C-Birqbr"; 

        let currentQueue = [...corePlaylist];
        let currentIndex = 0;
        let isLoadingMore = false;

        const container = document.getElementById('media-container');
        const titleEl = document.getElementById('display-title');
        const descEl = document.getElementById('display-desc');
        const queueList = document.getElementById('queue-list');
        const progressBar = document.getElementById('progress-bar');

        // ==========================================
        // LOGIC
        // ==========================================

        function init() {
            renderQueue();
            loadMedia(0);
        }

        function renderQueue() {
            queueList.innerHTML = '';
            currentQueue.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `queue-item ${index === currentIndex ? 'active' : ''}`;
                div.onclick = () => loadMedia(index);
                
                // Thumbnail Logic: Use Image if available, else Icon
                const thumbHtml = item.thumbnailUrl 
                    ? `<img src="${item.thumbnailUrl}" class="thumb-img" alt="thumb">` 
                    : `<div class="thumb-placeholder">${item.thumbIcon || '📺'}</div>`;

                div.innerHTML = `
                    ${thumbHtml}
                    <div class="item-details">
                        <h4>${item.title}</h4>
                        <p>${item.type.toUpperCase()} • ${item.date || 'Recent'}</p>
                    </div>
                `;
                queueList.appendChild(div);
            });
        }

        function loadMedia(index) {
            if (index >= currentQueue.length) index = 0;
            currentIndex = index;
            const item = currentQueue[index];

            container.innerHTML = '';
            progressBar.style.width = '0%';
            
            // Fade Text
            titleEl.style.opacity = 0;
            setTimeout(() => {
                titleEl.innerText = item.title;
                descEl.innerText = item.desc;
                titleEl.style.transition = 'opacity 0.5s';
                titleEl.style.opacity = 1;
            }, 200);

            // Inject Media
            if (item.type === 'video') {
                const iframe = document.createElement('iframe');
                iframe.src = item.src;
                iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
                iframe.allowFullscreen = true;
                container.appendChild(iframe);
                simulateProgress();
            } else if (item.type === 'audio') {
                const iframe = document.createElement('iframe');
                iframe.src = item.src;
                iframe.width = "100%";
                iframe.height = "100%";
                iframe.frameBorder = "0";
                container.appendChild(iframe);
                progressBar.style.display = 'none';
            }

            renderQueue();
        }

        function simulateProgress() {
            progressBar.style.display = 'block';
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 100) clearInterval(interval);
                else {
                    width += 0.5;
                    progressBar.style.width = width + '%';
                }
            }, 100);
        }

        // ==========================================
        // YOUTUBE API FETCHER (PLAYLIST MODE)
        // ==========================================
        async function fetchMoreVideos() {
            if (!YT_API_KEY || !TARGET_PLAYLIST_ID) {
                alert("⚠️ Configuration Missing!\n\nPlease ensure YT_API_KEY and TARGET_PLAYLIST_ID are set.");
                return;
            }
            if (isLoadingMore) return;
            isLoadingMore = true;
            document.querySelector('.load-more-btn').innerText = "Loading...";

            try {
                // Fetch items FROM THE PLAYLIST (Not general search)
                // This returns video details directly linked to the playlist order
                const url = `https://www.googleapis.com/youtube/v3/playlistItems?key=${YT_API_KEY}&playlistId=${TARGET_PLAYLIST_ID}&part=snippet,contentDetails&maxResults=10`;
                
                const response = await fetch(url);
                const data = await response.json();

                if (data.items && data.items.length > 0) {
                    const newItems = data.items.map(item => {
                        // Extract Video ID from the playlist item structure
                        const videoId = item.contentDetails.videoId;
                        
                        return {
                            id: Date.now() + Math.random(), 
                            type: 'video',
                            // Construct Embed URL
                            src: `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0&rel=0&modestbranding=1`,
                            title: item.snippet.title,
                            desc: item.snippet.description.substring(0, 50) + "...",
                            thumbnailUrl: item.snippet.thumbnails.medium.url,
                            date: new Date(item.snippet.publishedAt).toLocaleDateString()
                        };
                    });

                    // Append to existing queue
                    currentQueue = [...currentQueue, ...newItems];
                    renderQueue();
                    
                    // Scroll to bottom of queue
                    queueList.scrollTop = queueList.scrollHeight;
                }
            } catch (error) {
                console.error("API Error:", error);
                alert("Failed to load playlist videos. Check Console.");
            } finally {
                isLoadingMore = false;
                document.querySelector('.load-more-btn').innerText = "+ Load More";
            }
        }

        // START APP
        init();

    </script>
</body>
</html>
