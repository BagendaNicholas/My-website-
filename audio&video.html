<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE Hub | Nicholas Bagenda</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #050505;       
            --accent-cyan: #00E5FF;   
            --accent-purple: #A277FF; /* New Accent for Audio */
            --accent-red: #FF3B30;    
            --text-main: #FFFFFF;     
            --text-dim: #888888;     
            --glass: rgba(20, 20, 20, 0.9);
            --panel-bg: #0a0a0a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER --- */
        header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }

        .logo { font-weight: 700; letter-spacing: 1px; font-size: 1.1rem; }
        .logo span { color: var(--accent-cyan); }

        .live-badge {
            background: var(--accent-red);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            animation: pulse 2s infinite;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 59, 48, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        .exit-btn {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .exit-btn:hover { color: var(--accent-cyan); }

        /* --- MAIN LAYOUT --- */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 380px; 
            gap: 0;
            height: calc(100vh - 60px);
        }

        /* --- LEFT: THE STAGE --- */
        .stage {
            position: relative;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #media-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe, audio {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Special Styling for Audio Visualizer Placeholder */
        .audio-visualizer {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }
        
        .vinyl-record {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: url('https://i.imgur.com/8QzRkLp.jpeg') center/cover; /* Default placeholder */
            border: 10px solid #333;
            box-shadow: 0 0 30px rgba(162, 119, 255, 0.3);
            animation: spin 4s linear infinite;
            animation-play-state: paused; /* Paused by default */
        }

        .vinyl-record.playing {
            animation-play-state: running;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .audio-info-center {
            margin-top: 20px;
            text-align: center;
        }

        /* Overlay Info */
        .overlay-info {
            position: absolute;
            bottom: 40px;
            left: 40px;
            z-index: 10;
            pointer-events: none;
            max-width: 80%;
        }

        .current-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.2;
            text-shadow: 0 4px 15px rgba(0,0,0,0.9);
        }

        .current-desc {
            font-size: 1rem;
            color: #ddd;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        /* Controls Bar */
        .controls-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            z-index: 20;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            width: 0%;
            transition: width 0.1s linear;
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        /* Floating Controls */
        .floating-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 30;
            display: flex;
            gap: 10px;
        }

        .ctrl-btn {
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .ctrl-btn:hover {
            background: var(--accent-cyan);
            color: #000;
            transform: scale(1.1);
        }

        /* --- RIGHT: THE QUEUE --- */
        .queue-panel {
            background: var(--panel-bg);
            border-left: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .queue-tabs {
            display: flex;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .q-tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dim);
            transition: 0.3s;
            border-bottom: 2px solid transparent;
        }

        .q-tab.active {
            color: var(--accent-cyan);
            border-bottom-color: var(--accent-cyan);
            background: rgba(0, 229, 255, 0.05);
        }
        
        .q-tab.audio-active {
            color: var(--accent-purple);
            border-bottom-color: var(--accent-purple);
            background: rgba(162, 119, 255, 0.05);
        }

        .queue-header {
            padding: 15px 20px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            position: sticky;
            top: 50px; /* Below tabs */
            z-index: 5;
        }

        .load-more-btn {
            background: transparent;
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
        }
        .load-more-btn:hover { background: var(--accent-cyan); color: #000; }
        .load-more-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .queue-list {
            flex: 1;
            overflow-y: auto;
        }

        .queue-item {
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            display: flex;
            gap: 15px;
            align-items: center;
            position: relative;
        }

        .queue-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .queue-item.active-video {
            background: rgba(0, 229, 255, 0.1);
            border-left: 4px solid var(--accent-cyan);
        }
        
        .queue-item.active-audio {
            background: rgba(162, 119, 255, 0.1);
            border-left: 4px solid var(--accent-purple);
        }

        .thumb-placeholder {
            width: 64px;
            height: 64px; /* Square for albums */
            background: #222;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: #666;
            overflow: hidden;
            flex-shrink: 0;
        }
        
        .thumb-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-details h4 {
            font-size: 0.95rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
            color: var(--text-main);
        }

        .item-details p {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        /* Mobile Adjustment */
        @media (max-width: 768px) {
            main {
                grid-template-columns: 1fr;
                grid-template-rows: 55vh 1fr; 
            }
            .queue-panel {
                border-left: none;
                border-top: 1px solid rgba(255,255,255,0.1);
            }
            .current-title { font-size: 1.4rem; }
            .overlay-info { left: 20px; bottom: 20px; }
            .floating-controls { display: none; }
            .vinyl-record { width: 150px; height: 150px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">NICHOLAS<span>BAGENDA</span></div>
        <div class="live-indicator">
            <span class="live-badge">● LIVE STREAM</span>
        </div>
        <a href="index.html" class="exit-btn">Exit ✕</a>
    </header>

    <main>
        <!-- LEFT: THE PLAYER STAGE -->
        <section class="stage">
            <div id="media-container"></div>
            
            <div class="overlay-info">
                <h2 class="current-title" id="display-title">Initializing...</h2>
                <p class="current-desc" id="display-desc">Connecting to Guardian Network...</p>
            </div>

            <div class="floating-controls">
                <button class="ctrl-btn" onclick="prevMedia()" title="Previous">⏮</button>
                <button class="ctrl-btn" onclick="togglePause()" title="Pause/Play">⏯</button>
                <button class="ctrl-btn" onclick="nextMedia()" title="Next">⏭</button>
            </div>

            <div class="controls-bar">
                <div class="progress-fill" id="progress-bar"></div>
            </div>
        </section>

        <!-- RIGHT: THE CONTENT QUEUE -->
        <aside class="queue-panel">
            <div class="queue-tabs">
                <div class="q-tab active" id="tab-video" onclick="switchTab('video')">📺 Ministry</div>
                <div class="q-tab" id="tab-audio" onclick="switchTab('audio')">🎵 Worship</div>
            </div>
            
            <div class="queue-header">
                <span id="queue-label">Up Next</span>
                <button class="load-more-btn" id="loadBtn" onclick="fetchMoreContent()">+ Load More</button>
            </div>
            <div id="queue-list" class="queue-list"></div>
        </aside>
    </main>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        
        // 1. Core Hardcoded Items (Always present)
        const coreItems = [
            {
                id: 'v1', type: 'video',
                src: 'https://www.youtube.com/embed/iD67VqeTdkE?rel=0&modestbranding=1',
                title: 'SDA Ministry Message 1', desc: 'Powerful teaching on Grace.', thumbIcon: '▶️'
            },
            {
                id: 'v2', type: 'video',
                src: 'https://www.youtube.com/embed/_yV7zniQs4g?rel=0&modestbranding=1',
                title: 'Worship Session Live', desc: 'Presence of God through praise.', thumbIcon: '🎵'
            },
            {
                id: 'a1', type: 'audio',
                // Using a reliable public MP3 for demo purposes initially
                src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',
                title: 'Sacred Hymn Intro', desc: 'Instrumental Reflection', thumbUrl: 'https://via.placeholder.com/150/333/fff?text=♪'
            }
        ];

        // 2. API Settings
        const YT_API_KEY = "AIzaSyBqQ0wS7u0LBo5XxO-ij8hMfmt8-CHAcAk"; 
        const TARGET_PLAYLIST_ID = "PLZ6afNou8CGsKAM7HvLVu0A47C-Birqbr"; 
        
        // Deezer Search Query for SDA Music
        const DEEZER_QUERY = "Seventh Day Adventist Worship"; 

        let currentQueue = [...coreItems];
        let currentIndex = 0;
        let isLoadingMore = false;
        let activeTab = 'video'; // 'video' or 'audio'
        let audioElement = null; // To store HTML5 Audio object

        const container = document.getElementById('media-container');
        const titleEl = document.getElementById('display-title');
        const descEl = document.getElementById('display-desc');
        const queueList = document.getElementById('queue-list');
        const progressBar = document.getElementById('progress-bar');
        const loadBtn = document.getElementById('loadBtn');
        const tabVideo = document.getElementById('tab-video');
        const tabAudio = document.getElementById('tab-audio');
        const queueLabel = document.getElementById('queue-label');

        // ==========================================
        // LOGIC
        // ==========================================

        function init() {
            renderQueue();
            loadMedia(0);
            
            // Keyboard Shortcuts
            document.addEventListener('keydown', (e) => {
                if(e.code === 'ArrowRight') nextMedia();
                if(e.code === 'ArrowLeft') prevMedia();
                if(e.code === 'Space') togglePause();
            });
        }

        function switchTab(tab) {
            activeTab = tab;
            
            // Update UI Classes
            if(tab === 'video') {
                tabVideo.classList.add('active');
                tabVideo.classList.remove('audio-active');
                tabAudio.classList.remove('active');
                tabAudio.classList.remove('audio-active');
                queueLabel.innerText = "Ministry Queue";
                loadBtn.style.borderColor = "var(--accent-cyan)";
                loadBtn.style.color = "var(--accent-cyan)";
            } else {
                tabAudio.classList.add('active');
                tabAudio.classList.add('audio-active');
                tabVideo.classList.remove('active');
                tabVideo.classList.remove('audio-active');
                queueLabel.innerText = "Worship Playlist";
                loadBtn.style.borderColor = "var(--accent-purple)";
                loadBtn.style.color = "var(--accent-purple)";
            }

            // Filter view (Optional: Could reload specific queues here)
            // For now, we just change context for loading more
            renderQueue();
        }

        function renderQueue() {
            queueList.innerHTML = '';
            
            // Sort/FILTER based on active tab if desired, 
            // BUT for this MVP, we show ALL items in one list so user sees variety.
            // However, highlighting depends on type.
            
            currentQueue.forEach((item, index) => {
                const div = document.createElement('div');
                
                // Determine Active Class
                let activeClass = '';
                if(index === currentIndex) {
                    activeClass = item.type === 'video' ? 'active-video' : 'active-audio';
                }

                div.className = `queue-item ${activeClass}`;
                div.onclick = () => loadMedia(index);
                
                const thumbHtml = item.thumbUrl 
                    ? `<img src="${item.thumbUrl}" class="thumb-img" alt="art">` 
                    : `<div class="thumb-placeholder">${item.thumbIcon || (item.type==='audio'?'🎵':'📺')}</div>`;

                div.innerHTML = `
                    ${thumbHtml}
                    <div class="item-details">
                        <h4>${item.title}</h4>
                        <p>${item.desc}</p>
                    </div>
                `;
                queueList.appendChild(div);
            });
        }

        function loadMedia(index) {
            if (index >= currentQueue.length) index = 0;
            if (index < 0) index = currentQueue.length - 1;
            
            currentIndex = index;
            const item = currentQueue[index];

            // Stop previous audio if playing
            if(audioElement) {
                audioElement.pause();
                audioElement.src = "";
                audioElement = null;
            }

            container.innerHTML = '';
            progressBar.style.width = '0%';
            
            // Update Text
            titleEl.style.opacity = 0;
            setTimeout(() => {
                titleEl.innerText = item.title;
                descEl.innerText = item.desc;
                titleEl.style.transition = 'opacity 0.5s';
                titleEl.style.opacity = 1;
            }, 200);

            // Inject Media
            if (item.type === 'video') {
                const iframe = document.createElement('iframe');
                iframe.src = item.src;
                iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
                iframe.allowFullscreen = true;
                container.appendChild(iframe);
                simulateProgress(); // Fake progress for video
            } 
            else if (item.type === 'audio') {
                // Create Custom Audio Visualizer Interface
                const visualizerDiv = document.createElement('div');
                visualizerDiv.className = 'audio-visualizer';
                
                // Vinyl Record Element
                const vinyl = document.createElement('div');
                vinyl.className = 'vinyl-record';
                if(item.thumbUrl) {
                    vinyl.style.backgroundImage = `url('${item.thumbUrl}')`;
                }
                vinyl.id = 'vinyl-disc';
                
                visualizerDiv.appendChild(vinyl);
                container.appendChild(visualizerDiv);

                // Create HTML5 Audio Object
                audioElement = new Audio(item.src);
                audioElement.crossOrigin = "anonymous";
                
                // Auto Play Attempt (Browser might block if no interaction yet)
                audioElement.play().then(() => {
                    vinyl.classList.add('playing');
                    startRealProgress();
                }).catch(e => {
                    console.log("Autoplay blocked:", e);
                    // User must click play button manually if blocked
                });

                // Handle End of Track -> Auto Next
                audioElement.onended = () => {
                    nextMedia();
                };
            }

            renderQueue();
        }

        function nextMedia() {
            loadMedia(currentIndex + 1);
        }

        function prevMedia() {
            loadMedia(currentIndex - 1);
        }

        function togglePause() {
            const currentItem = currentQueue[currentIndex];
            if(!currentItem) return;

            if(currentItem.type === 'audio' && audioElement) {
                if(audioElement.paused) {
                    audioElement.play();
                    document.getElementById('vinyl-disc').classList.add('playing');
                } else {
                    audioElement.pause();
                    document.getElementById('vinyl-disc').classList.remove('playing');
                }
            } else if (currentItem.type === 'video') {
                // Simple visual feedback for video pause (complex YT API needed for real pause)
                alert("Use player controls to pause video.");
            }
        }

        function simulateProgress() {
            progressBar.style.display = 'block';
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    // Optional: Auto-next for videos too
                    // setTimeout(nextMedia, 2000); 
                } else {
                    width += 0.5;
                    progressBar.style.width = width + '%';
                }
            }, 100);
        }
        
        function startRealProgress() {
             progressBar.style.display = 'block';
             const duration = audioElement.duration;
             
             const interval = setInterval(() => {
                 if(!audioElement || audioElement.paused) return;
                 
                 const percent = (audioElement.currentTime / duration) * 100;
                 progressBar.style.width = percent + '%';
                 
                 if(percent >= 100) {
                     clearInterval(interval);
                 }
             }, 100);
        }

        // ==========================================
        // DYNAMIC LOADING (HYBRID)
        // ==========================================
        async function fetchMoreContent() {
            if (isLoadingMore) return;
            isLoadingMore = true;
            loadBtn.innerText = "Loading...";
            loadBtn.disabled = true;

            try {
                if(activeTab === 'video') {
                    // FETCH YOUTUBE PLAYLIST
                    const url = `https://www.googleapis.com/youtube/v3/playlistItems?key=${YT_API_KEY}&playlistId=${TARGET_PLAYLIST_ID}&part=snippet,contentDetails&maxResults=10`;
                    const res = await fetch(url);
                    const data = await res.json();
                    
                    if(data.items) {
                        const newVideos = data.items.map(item => ({
                            id: Date.now() + Math.random(),
                            type: 'video',
                            src: `https://www.youtube.com/embed/${item.contentDetails.videoId}?rel=0&modestbranding=1`,
                            title: item.snippet.title,
                            desc: item.snippet.description.substring(0, 40) + "...",
                            thumbUrl: item.snippet.thumbnails.medium.url
                        }));
                        currentQueue = [...currentQueue, ...newVideos];
                    }
                } 
                else if (activeTab === 'audio') {
                    // FETCH DEEZER TRACKS (Free API)
                    // Note: Deezer search returns tracks. We take the first 10.
                    const searchUrl = `https://api.deezer.com/search?q=${encodeURIComponent(DEEZER_QUERY)}&limit=10`;
                    const res = await fetch(searchUrl);
                    const data = await res.json();
                    
                    if(data.data) {
                        const newTracks = data.data.map(track => ({
                            id: track.id,
                            type: 'audio',
                            // Use preview URL (30s clip) for stability, or replace with full stream if using paid API later
                            src: track.preview, 
                            title: track.title,
                            desc: `${track.artist.name} • ${track.album.title}`,
                            thumbUrl: track.album.cover_medium
                        }));
                        currentQueue = [...currentQueue, ...newTracks];
                    }
                }

                renderQueue();
                queueList.scrollTop = queueList.scrollHeight;
            } catch (error) {
                console.error("API Error:", error);
                alert("Failed to load content. Check connection.");
            } finally {
                isLoadingMore = false;
                loadBtn.innerText = "+ Load More";
                loadBtn.disabled = false;
            }
        }

        // START APP
        init();

    </script>
</body>
</html>
