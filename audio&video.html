<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE Hub | Nicholas Bagenda</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #050505;       /* Pure Black for Cinema Mode */
            --player-bg: #000000;
            --accent-cyan: #00E5FF;   
            --accent-red: #FF3B30;    /* For LIVE indicator */
            --text-main: #FFFFFF;     
            --text-dim: #888888;     
            --glass: rgba(20, 20, 20, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden; /* Prevent body scroll, handle internally */
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER --- */
        header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }

        .logo { font-weight: 700; letter-spacing: 1px; }
        .live-badge {
            background: var(--accent-red);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            animation: pulse 2s infinite;
            margin-left: 10px;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* --- MAIN LAYOUT --- */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 350px; /* Video Area | Queue Area */
            gap: 0;
            height: calc(100vh - 60px);
        }

        /* --- LEFT: THE STAGE (VIDEO/AUDIO) --- */
        .stage {
            position: relative;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Container for Iframe/Audio Visualizer */
        #media-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        iframe, audio {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Overlay Info */
        .overlay-info {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .current-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .current-desc {
            font-size: 1rem;
            color: #ccc;
            max-width: 600px;
        }

        /* Controls Bar */
        .controls-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.2);
            z-index: 20;
        }
        
        .progress-fill {
            height: 100%;
            background: var(--accent-cyan);
            width: 0%;
            transition: width 0.5s linear;
        }

        /* --- RIGHT: THE QUEUE (FEED) --- */
        .queue-panel {
            background: #111;
            border-left: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .queue-header {
            padding: 20px;
            font-weight: 600;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky;
            top: 0;
            background: #111;
            z-index: 5;
        }

        .queue-item {
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .queue-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .queue-item.active {
            background: rgba(0, 229, 255, 0.1);
            border-left: 3px solid var(--accent-cyan);
        }

        .thumb-placeholder {
            width: 60px;
            height: 40px;
            background: #333;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: #666;
        }

        .item-details h4 {
            font-size: 0.95rem;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        .item-details p {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        /* Mobile Adjustment */
        @media (max-width: 768px) {
            main {
                grid-template-columns: 1fr;
                grid-template-rows: 60vh 1fr; /* Video takes 60%, Queue takes rest */
            }
            .queue-panel {
                border-left: none;
                border-top: 1px solid rgba(255,255,255,0.1);
            }
            .current-title { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">NICHOLAS<span style="color:var(--accent-cyan)">BAGENDA</span></div>
        <div class="live-indicator">
            <span class="live-badge">● LIVE FEED</span>
        </div>
        <a href="index.html" style="color:white; text-decoration:none; font-size:0.9rem;">Exit</a>
    </header>

    <main>
        <!-- LEFT: THE PLAYER STAGE -->
        <section class="stage">
            <div id="media-container">
                <!-- Content injected via JS -->
            </div>
            
            <div class="overlay-info">
                <h2 class="current-title" id="display-title">Loading...</h2>
                <p class="current-desc" id="display-desc">Please wait while we connect to the stream.</p>
            </div>

            <div class="controls-bar">
                <div class="progress-fill" id="progress-bar"></div>
            </div>
        </section>

        <!-- RIGHT: THE CONTENT QUEUE -->
        <aside class="queue-panel">
            <div class="queue-header">Up Next</div>
            <div id="queue-list">
                <!-- Items injected via JS -->
            </div>
        </aside>
    </main>

    <script>
        // 1. DATA SOURCE (Your Real Links)
        const mediaQueue = [
            {
                id: 1,
                type: 'video',
                src: 'https://www.youtube.com/embed/iD67VqeTdkE?autoplay=1&mute=0&rel=0&modestbranding=1',
                title: 'SDA Ministry Message 1',
                desc: 'Powerful teaching on Grace and Salvation.',
                thumb: '▶️'
            },
            {
                id: 2,
                type: 'video',
                src: 'https://www.youtube.com/embed/_yV7zniQs4g?autoplay=1&mute=0&rel=0&modestbranding=1',
                title: 'Worship Session Live',
                desc: 'Experience the presence of God through praise.',
                thumb: '🎵'
            },
            {
                id: 3,
                type: 'audio',
                src: 'https://open.spotify.com/embed/playlist/5KpUf3Ys4G60aM8toOOh55?utm_source=generator&theme=0',
                title: 'SDA Worship Collection',
                desc: 'Curated hymns for spiritual reflection.',
                thumb: '🎧'
            },
            {
                id: 4,
                type: 'audio',
                src: 'https://open.spotify.com/embed/album/35OMn3mHWWKQ31hNn6YBHA?utm_source=generator&theme=0',
                title: 'Featured Album',
                desc: 'High fidelity listening experience.',
                thumb: '💿'
            },
             {
                id: 5,
                type: 'audio',
                src: 'https://open.spotify.com/embed/track/1GzBtCQ0udrRePGJ1xYSvB?utm_source=generator&theme=0',
                title: 'Spotlight Track',
                desc: 'Special selection of the day.',
                thumb: '⭐'
            }
        ];

        let currentIndex = 0;
        const container = document.getElementById('media-container');
        const titleEl = document.getElementById('display-title');
        const descEl = document.getElementById('display-desc');
        const queueList = document.getElementById('queue-list');
        const progressBar = document.getElementById('progress-bar');

        // 2. RENDER QUEUE LIST
        function renderQueue() {
            queueList.innerHTML = '';
            mediaQueue.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `queue-item ${index === currentIndex ? 'active' : ''}`;
                div.onclick = () => loadMedia(index);
                
                div.innerHTML = `
                    <div class="thumb-placeholder">${item.thumb}</div>
                    <div class="item-details">
                        <h4>${item.title}</h4>
                        <p>${item.type.toUpperCase()}</p>
                    </div>
                `;
                queueList.appendChild(div);
            });
        }

        // 3. LOAD MEDIA LOGIC
        function loadMedia(index) {
            if (index >= mediaQueue.length) {
                index = 0; // Loop back to start for "Infinite" feel
            }
            
            currentIndex = index;
            const item = mediaQueue[index];

            // Clear previous
            container.innerHTML = '';
            
            // Update Text with Fade Effect
            titleEl.style.opacity = 0;
            setTimeout(() => {
                titleEl.innerText = item.title;
                descEl.innerText = item.desc;
                titleEl.style.transition = 'opacity 0.5s';
                titleEl.style.opacity = 1;
            }, 200);

            // Inject New Media
            if (item.type === 'video') {
                const iframe = document.createElement('iframe');
                iframe.src = item.src;
                iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
                iframe.allowFullscreen = true;
                container.appendChild(iframe);
                
                // Simulate Progress Bar for Videos (Visual Only)
                simulateProgress();
            } else if (item.type === 'audio') {
                const iframe = document.createElement('iframe');
                iframe.src = item.src;
                iframe.width = "100%";
                iframe.height = "100%";
                iframe.frameBorder = "0";
                iframe.allowTransparency = "true";
                container.appendChild(iframe);
                
                // Audio doesn't have easy API access for progress in simple embeds, 
                // so we hide the bar or keep it static
                progressBar.style.display = 'none';
            }

            renderQueue(); // Highlight active item
            
            // Auto-load next when video ends (Requires YT API, simplified here with timeout for demo)
            // In a real pro app, we'd use postMessage listener. 
            // For this MVP, we just let user click or wait.
        }

        // 4. SIMULATE PROGRESS BAR (For Video Feel)
        function simulateProgress() {
            progressBar.style.display = 'block';
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    // Optional: Auto-next logic could go here
                } else {
                    width += 0.5; // Speed adjustment
                    progressBar.style.width = width + '%';
                }
            }, 100); // Tick every 100ms
        }

        // INIT
        loadMedia(0);

    </script>
</body>
</html>
