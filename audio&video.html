<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE Hub | Nicholas Bagenda</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #050505;       
            --accent-cyan: #00E5FF;   
            --accent-red: #FF3B30;    
            --text-main: #FFFFFF;     
            --text-dim: #888888;     
            --glass: rgba(20, 20, 20, 0.9);
            --panel-bg: #0a0a0a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER --- */
        header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }

        .logo { font-weight: 700; letter-spacing: 1px; font-size: 1.1rem; }
        .logo span { color: var(--accent-cyan); }

        .live-badge {
            background: var(--accent-red);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            animation: pulse 2s infinite;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 59, 48, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        .exit-btn {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .exit-btn:hover { color: var(--accent-cyan); }

        /* --- MAIN LAYOUT --- */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 380px; 
            gap: 0;
            height: calc(100vh - 60px);
        }

        /* --- LEFT: THE STAGE --- */
        .stage {
            position: relative;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #media-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        iframe, audio {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Overlay Info */
        .overlay-info {
            position: absolute;
            bottom: 40px;
            left: 40px;
            z-index: 10;
            pointer-events: none;
            max-width: 80%;
        }

        .current-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.2;
            text-shadow: 0 4px 15px rgba(0,0,0,0.9);
        }

        .current-desc {
            font-size: 1rem;
            color: #ddd;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        /* Controls Bar */
        .controls-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            z-index: 20;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), #fff);
            width: 0%;
            transition: width 0.1s linear;
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        /* Floating Controls (Optional UI polish) */
        .floating-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 30;
            display: flex;
            gap: 10px;
        }

        .ctrl-btn {
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .ctrl-btn:hover {
            background: var(--accent-cyan);
            color: #000;
            transform: scale(1.1);
        }

        /* --- RIGHT: THE QUEUE --- */
        .queue-panel {
            background: var(--panel-bg);
            border-left: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .queue-header {
            padding: 20px;
            font-weight: 600;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky;
            top: 0;
            background: var(--panel-bg);
            z-index: 5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .load-more-btn {
            background: transparent;
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
        }
        .load-more-btn:hover { background: var(--accent-cyan); color: #000; }
        .load-more-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .queue-item {
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            display: flex;
            gap: 15px;
            align-items: center;
            position: relative;
        }

        .queue-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .queue-item.active {
            background: rgba(0, 229, 255, 0.1);
            border-left: 4px solid var(--accent-cyan);
        }

        /* Playing Indicator Animation */
        .playing-indicator {
            display: none;
            width: 12px;
            height: 12px;
            margin-right: 8px;
        }
        
        .queue-item.active .playing-indicator {
            display: block;
        }

        .bar {
            width: 3px;
            height: 100%;
            background: var(--accent-cyan);
            animation: equalizer 1s infinite ease-in-out;
        }
        .bar:nth-child(2) { animation-delay: 0.2s; }
        .bar:nth-child(3) { animation-delay: 0.4s; }

        @keyframes equalizer {
            0%, 100% { height: 4px; }
            50% { height: 12px; }
        }

        .thumb-placeholder {
            width: 64px;
            height: 44px;
            background: #222;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: #666;
            overflow: hidden;
            flex-shrink: 0;
        }
        
        .thumb-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-details h4 {
            font-size: 0.95rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
            color: var(--text-main);
        }

        .item-details p {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        /* Mobile Adjustment */
        @media (max-width: 768px) {
            main {
                grid-template-columns: 1fr;
                grid-template-rows: 55vh 1fr; 
            }
            .queue-panel {
                border-left: none;
                border-top: 1px solid rgba(255,255,255,0.1);
            }
            .current-title { font-size: 1.4rem; }
            .overlay-info { left: 20px; bottom: 20px; }
            .floating-controls { display: none; } /* Hide floating controls on mobile to save space */
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">NICHOLAS<span>BAGENDA</span></div>
        <div class="live-indicator">
            <span class="live-badge">● LIVE STREAM</span>
        </div>
        <a href="index.html" class="exit-btn">Exit ✕</a>
    </header>

    <main>
        <!-- LEFT: THE PLAYER STAGE -->
        <section class="stage">
            <div id="media-container"></div>
            
            <div class="overlay-info">
                <h2 class="current-title" id="display-title">Initializing...</h2>
                <p class="current-desc" id="display-desc">Connecting to Guardian Network...</p>
            </div>

            <div class="floating-controls">
                <button class="ctrl-btn" onclick="prevMedia()" title="Previous">⏮</button>
                <button class="ctrl-btn" onclick="togglePause()" title="Pause/Play">⏯</button>
                <button class="ctrl-btn" onclick="nextMedia()" title="Next">⏭</button>
            </div>

            <div class="controls-bar">
                <div class="progress-fill" id="progress-bar"></div>
            </div>
        </section>

        <!-- RIGHT: THE CONTENT QUEUE -->
        <aside class="queue-panel">
            <div class="queue-header">
                Up Next 
                <button class="load-more-btn" id="loadBtn" onclick="fetchMoreVideos()">+ Load More</button>
            </div>
            <div id="queue-list"></div>
        </aside>
    </main>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        
        const corePlaylist = [
            {
                id: 1, type: 'video',
                src: 'https://www.youtube.com/embed/iD67VqeTdkE?enablejsapi=1&rel=0&modestbranding=1',
                title: 'SDA Ministry Message 1', desc: 'Powerful teaching on Grace.', thumbIcon: '▶️'
            },
            {
                id: 2, type: 'video',
                src: 'https://www.youtube.com/embed/_yV7zniQs4g?enablejsapi=1&rel=0&modestbranding=1',
                title: 'Worship Session Live', desc: 'Presence of God through praise.', thumbIcon: '🎵'
            },
            {
                id: 3, type: 'audio',
                src: 'https://open.spotify.com/embed/playlist/5KpUf3Ys4G60aM8toOOh55?utm_source=generator&theme=0',
                title: 'SDA Worship Collection', desc: 'Curated hymns.', thumbIcon: '🎧'
            }
        ];

        const YT_API_KEY = "AIzaSyBqQ0wS7u0LBo5XxO-ij8hMfmt8-CHAcAk"; 
        const TARGET_PLAYLIST_ID = "PLZ6afNou8CGsKAM7HvLVu0A47C-Birqbr"; 

        let currentQueue = [...corePlaylist];
        let currentIndex = 0;
        let isLoadingMore = false;
        let playerInstance = null; // For YouTube API control

        const container = document.getElementById('media-container');
        const titleEl = document.getElementById('display-title');
        const descEl = document.getElementById('display-desc');
        const queueList = document.getElementById('queue-list');
        const progressBar = document.getElementById('progress-bar');
        const loadBtn = document.getElementById('loadBtn');

        // ==========================================
        // LOGIC
        // ==========================================

        function init() {
            renderQueue();
            loadMedia(0);
            
            // Keyboard Shortcuts
            document.addEventListener('keydown', (e) => {
                if(e.code === 'ArrowRight') nextMedia();
                if(e.code === 'ArrowLeft') prevMedia();
                if(e.code === 'Space') togglePause();
            });
        }

        function renderQueue() {
            queueList.innerHTML = '';
            currentQueue.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `queue-item ${index === currentIndex ? 'active' : ''}`;
                div.onclick = () => loadMedia(index);
                
                const thumbHtml = item.thumbnailUrl 
                    ? `<img src="${item.thumbnailUrl}" class="thumb-img" alt="thumb">` 
                    : `<div class="thumb-placeholder">${item.thumbIcon || '📺'}</div>`;

                // Add Equalizer bars only to active item
                const eqBars = index === currentIndex ? '<div class="playing-indicator"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>' : '';

                div.innerHTML = `
                    ${eqBars}
                    ${thumbHtml}
                    <div class="item-details">
                        <h4>${item.title}</h4>
                        <p>${item.type.toUpperCase()} • ${item.date || 'Recent'}</p>
                    </div>
                `;
                queueList.appendChild(div);
            });
        }

        function loadMedia(index) {
            if (index >= currentQueue.length) index = 0;
            if (index < 0) index = currentQueue.length - 1;
            
            currentIndex = index;
            const item = currentQueue[index];

            container.innerHTML = '';
            progressBar.style.width = '0%';
            
            // Update Text with Fade
            titleEl.style.opacity = 0;
            setTimeout(() => {
                titleEl.innerText = item.title;
                descEl.innerText = item.desc;
                titleEl.style.transition = 'opacity 0.5s';
                titleEl.style.opacity = 1;
            }, 200);

            // Inject Media
            if (item.type === 'video') {
                // Use enablejsapi=1 to allow control
                const iframeSrc = item.src.includes('?') ? `${item.src}&enablejsapi=1` : `${item.src}?enablejsapi=1`;
                
                const iframe = document.createElement('iframe');
                iframe.id = 'yt-player';
                iframe.src = iframeSrc;
                iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
                iframe.allowFullscreen = true;
                container.appendChild(iframe);
                
                simulateProgress();
            } else if (item.type === 'audio') {
                const iframe = document.createElement('iframe');
                iframe.src = item.src;
                iframe.width = "100%";
                iframe.height = "100%";
                iframe.frameBorder = "0";
                container.appendChild(iframe);
                progressBar.style.display = 'none';
            }

            renderQueue();
        }

        function nextMedia() {
            loadMedia(currentIndex + 1);
        }

        function prevMedia() {
            loadMedia(currentIndex - 1);
        }

        function togglePause() {
            // Simple visual feedback since we can't easily pause Spotify/YT without complex API hooks
            // In a real production app, we'd use postMessage to send commands to the iframe
            const btn = document.querySelector('.ctrl-btn:nth-child(2)');
            btn.style.transform = "scale(0.9)";
            setTimeout(() => btn.style.transform = "scale(1)", 100);
        }

        function simulateProgress() {
            progressBar.style.display = 'block';
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    // AUTO-NEXT FEATURE: Uncomment below to loop automatically
                    // setTimeout(nextMedia, 2000); 
                } else {
                    width += 0.5;
                    progressBar.style.width = width + '%';
                }
            }, 100);
        }

        // ==========================================
        // YOUTUBE API FETCHER
        // ==========================================
        async function fetchMoreVideos() {
            if (!YT_API_KEY || !TARGET_PLAYLIST_ID) return;
            if (isLoadingMore) return;
            
            isLoadingMore = true;
            loadBtn.innerText = "Loading...";
            loadBtn.disabled = true;

            try {
                const url = `https://www.googleapis.com/youtube/v3/playlistItems?key=${YT_API_KEY}&playlistId=${TARGET_PLAYLIST_ID}&part=snippet,contentDetails&maxResults=10`;
                
                const response = await fetch(url);
                const data = await response.json();

                if (data.items && data.items.length > 0) {
                    const newItems = data.items.map(item => {
                        const videoId = item.contentDetails.videoId;
                        return {
                            id: Date.now() + Math.random(), 
                            type: 'video',
                            src: `https://www.youtube.com/embed/${videoId}?rel=0&modestbranding=1`,
                            title: item.snippet.title,
                            desc: item.snippet.description.substring(0, 50) + "...",
                            thumbnailUrl: item.snippet.thumbnails.medium.url,
                            date: new Date(item.snippet.publishedAt).toLocaleDateString()
                        };
                    });

                    currentQueue = [...currentQueue, ...newItems];
                    renderQueue();
                    queueList.scrollTop = queueList.scrollHeight;
                }
            } catch (error) {
                console.error("API Error:", error);
                alert("Connection failed. Check internet.");
            } finally {
                isLoadingMore = false;
                loadBtn.innerText = "+ Load More";
                loadBtn.disabled = false;
            }
        }

        // START APP
        init();

    </script>
</body>
</html>
