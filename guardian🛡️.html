<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guardian OS | Stream Center</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
    /* --- GUARDIAN VARIABLES --- */
    :root {
        --bg-deep: #050505;
        --neon-cyan: #00f3ff;
        --neon-purple: #bc13fe;
        --glass-bg: rgba(15, 15, 20, 0.7);
        --border-color: rgba(0, 243, 255, 0.2);
        --text-main: #ffffff;
        --text-dim: #a0a0a0;
        --success: #00ff64;
        --danger: #ff3232;
    }

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        cursor: crosshair;
    }

    body{
        background:#050505;
        color:#fff;
        font-family:'Poppins',sans-serif;
        min-height:100vh;
        padding:20px;
        position:relative;
        overflow-x:hidden;
    }

    /* BACKGROUND CANVAS LAYER */
    #network-canvas {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: -1;
        opacity: 0.3;
        pointer-events: none;
    }

    /* HEADER */
    .header{
        text-align:center;
        margin-bottom:30px;
        position:relative;
        z-index: 1;
    }

    .header h1{
        font-family:'Orbitron', sans-serif;
        font-size:2.5rem;
        margin-bottom:8px;
        color:var(--neon-cyan);
        text-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    .header p{
        color:var(--text-dim);
        font-size: 0.9rem;
        letter-spacing: 1px;
    }

    /* DASHBOARD GRID STRUCTURE */
    .dashboard-container {
        max-width: 1400px;
        margin: auto;
        display: flex;
        flex-direction: column;
        gap: 25px;
        position: relative;
        z-index: 1;
    }

    /* TOP ROW: NEWS + MEDIA */
    .top-row {
        display: grid;
        grid-template-columns: 1fr 1fr; /* Split evenly */
        gap: 25px;
    }

    /* BOTTOM ROW: MOVIES (FULL WIDTH) */
    .bottom-row {
        width: 100%;
    }

    /* CARDS */
    .card{
        background:var(--glass-bg);
        border-radius:16px;
        padding:25px;
        backdrop-filter:blur(12px);
        border:1px solid var(--border-color);
        transition: all 0.3s ease;
        position:relative;
        overflow:hidden;
        display:flex;
        flex-direction:column;
    }

    .card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 2px;
        background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
        opacity: 0.5;
    }

    .card:hover {
        border-color: var(--neon-cyan);
        box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);
        transform: translateY(-5px);
    }

    h2{
        font-family:'Orbitron', sans-serif;
        margin-bottom:20px;
        display:flex;
        align-items:center;
        gap:10px;
        color:white;
        font-size: 1.2rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 10px;
    }

    h2 i {
        color: var(--neon-cyan);
    }

    /* INPUTS & BUTTONS */
    input, select{
        width:100%;
        padding:12px;
        border:1px solid rgba(255,255,255,0.1);
        border-radius:8px;
        background:rgba(0,0,0,0.3);
        color:white;
        margin-bottom:15px;
        font-family: 'Poppins', sans-serif;
        transition: 0.3s;
    }

    input:focus, select:focus {
        outline:none;
        border-color: var(--neon-cyan);
        box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        background: rgba(0,0,0,0.5);
    }

    button{
        padding:12px;
        border:none;
        border-radius:8px;
        background:transparent;
        border:1px solid var(--neon-cyan);
        color:var(--neon-cyan);
        cursor:pointer;
        font-weight:bold;
        font-family:'Orbitron', sans-serif;
        text-transform:uppercase;
        letter-spacing:1px;
        transition:0.3s;
        width:100%;
        position:relative;
        overflow:hidden;
    }

    button:hover{
        background:var(--neon-cyan);
        color:black;
        box-shadow: 0 0 15px var(--neon-cyan);
    }

    /* NEWS SECTION */
    .news-grid{
        flex-grow: 1;
        max-height: 500px;
        overflow-y:auto;
        padding-right:5px;
    }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    ::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 3px; }

    .news-item{
        background:rgba(255,255,255,0.03);
        border-radius:10px;
        margin-bottom:15px;
        cursor:pointer;
        transition:0.3s;
        border-left:3px solid transparent;
        display:flex;
        gap:15px;
        padding:12px;
        align-items:center;
    }

    .news-item:hover{
        background:rgba(0, 243, 255, 0.05);
        border-left-color: var(--neon-cyan);
        transform: translateX(5px);
    }

    .news-item-img{
        width:80px;
        height:60px;
        object-fit:cover;
        border-radius:6px;
        flex-shrink:0;
        filter: grayscale(100%) brightness(0.8);
        transition: 0.3s;
    }

    .news-item:hover .news-item-img {
        filter: grayscale(0%) brightness(1);
    }

    .news-item-content h4{
        margin-bottom:5px;
        color:white;
        font-size:0.9rem;
        line-height:1.3;
        display:-webkit-box;
        -webkit-line-clamp:2;
        -webkit-box-orient:vertical;
        overflow:hidden;
    }

    .news-item-content p{
        font-size:0.75rem;
        color:var(--text-dim);
        line-height:1.4;
        display:-webkit-box;
        -webkit-line-clamp:2;
        -webkit-box-orient:vertical;
        overflow:hidden;
    }

    .source-tag {
        font-size: 0.65rem;
        color: var(--neon-cyan);
        margin-top: 5px;
        display: block;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* MEDIA HUB SECTION (NEW) */
    .media-hub-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        height: 100%;
    }

    .media-tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
    }

    .tab-btn {
        flex: 1;
        padding: 10px;
        background: rgba(0,0,0,0.3);
        border: 1px solid rgba(255,255,255,0.1);
        color: var(--text-dim);
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
        font-family: 'Orbitron', sans-serif;
        font-size: 0.8rem;
    }

    .tab-btn.active {
        background: var(--neon-cyan);
        color: black;
        border-color: var(--neon-cyan);
        box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
    }

    .media-display-area {
        flex-grow: 1;
        background: #000;
        border-radius: 12px;
        overflow: hidden;
        position: relative;
        min-height: 300px;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 1px solid rgba(255,255,255,0.05);
    }

    .media-display-area iframe, 
    .media-display-area audio {
        width: 100%;
        height: 100%;
        border: none;
    }
    
    /* Specific styling for Spotify if needed */
    .spotify-frame {
        width: 100%;
        height: 100%;
        min-height: 300px;
    }

    /* MOVIES SECTION */
    .movie-controls {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }
    
    .movie-search-input {
        flex-grow: 1;
        margin-bottom: 0 !important;
    }

    .movie-grid{
        display:grid;
        grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
        gap:20px;
        margin-top:10px;
        max-height:600px;
        overflow-y:auto;
        padding-bottom: 10px;
    }

    .movie-item{
        background:rgba(0,0,0,0.3);
        border-radius:8px;
        overflow:hidden;
        cursor:pointer;
        transition:0.3s;
        border:1px solid transparent;
        position:relative;
        aspect-ratio: 2/3;
    }

    .movie-item:hover{
        border-color: var(--neon-purple);
        transform: scale(1.05);
        box-shadow: 0 0 15px rgba(188, 19, 254, 0.3);
        z-index: 2;
    }

    .movie-item img{
        width:100%;
        height:100%;
        object-fit:cover;
        display:block;
    }

    .movie-title-overlay {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        padding: 15px 10px 10px;
        color: white;
        font-size: 0.85rem;
        font-weight: 600;
        text-align: center;
        opacity: 0;
        transition: 0.3s;
        height: 100%;
        display: flex;
        align-items: flex-end;
        justify-content: center;
    }

    .movie-item:hover .movie-title-overlay {
        opacity: 1;
    }

    /* MODALS */
    #videoModal, #newsModal{
        display:none;
        position:fixed;
        top:0; left:0;
        width:100%; height:100%;
        background:rgba(0,0,0,0.95);
        backdrop-filter: blur(10px);
        z-index:2000;
        justify-content:center;
        align-items:center;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-inner, .news-modal-inner{
        width:90%;
        max-width:900px;
        position:relative;
        background:var(--glass-bg);
        border:1px solid var(--border-color);
        border-radius:16px;
        padding:20px;
        box-shadow: 0 0 50px rgba(0, 243, 255, 0.2);
    }

    .close-btn, .close-news-btn{
        position:absolute;
        top:-15px; right:-15px;
        background:var(--danger);
        color:white;
        width:40px; height:40px;
        border-radius:50%;
        border:none;
        cursor:pointer;
        font-size:1.2rem;
        display:flex;
        align-items:center;
        justify-content:center;
        box-shadow: 0 0 10px var(--danger);
        transition: 0.3s;
        z-index: 10;
    }

    .close-btn:hover, .close-news-btn:hover {
        transform: rotate(90deg) scale(1.1);
        background: #ff0000;
    }

    .news-modal-img{
        width:100%;
        border-radius:12px;
        margin-bottom:20px;
        max-height:300px;
        object-fit:cover;
        border:1px solid rgba(255,255,255,0.1);
    }

    .read-full-btn {
        display:inline-block;
        margin-top:15px;
        padding:10px 20px;
        background:var(--neon-cyan);
        color:black;
        font-weight:bold;
        text-decoration:none;
        border-radius:6px;
        font-family:'Orbitron', sans-serif;
        text-transform:uppercase;
        font-size:0.8rem;
        transition:0.3s;
    }
    .read-full-btn:hover {
        box-shadow: 0 0 15px var(--neon-cyan);
        transform: translateY(-2px);
    }

    /* LOADING STATES */
    .loading-spinner {
        text-align: center;
        padding: 20px;
        color: var(--neon-cyan);
        font-family: 'Orbitron', sans-serif;
        animation: blink 1s infinite;
    }
    @keyframes blink { 50% { opacity: 0.5; } }

    /* Responsive Adjustments */
    @media (max-width: 900px) {
        .top-row {
            grid-template-columns: 1fr; /* Stack News and Media on tablet/mobile */
        }
        .movie-grid {
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        }
    }
</style>
</head>

<body>

    <!-- Living Background Canvas -->
    <canvas id="network-canvas"></canvas>

    <div class="header">
        <h1><i class="fas fa-satellite-dish"></i> Guardian Stream</h1>
        <p>// REAL_TIME_NEWS // AUDIO_VISUAL_HUB // CINEMA_DB</p>
    </div>

    <div class="dashboard-container">

        <!-- TOP ROW: SPLIT VIEW -->
        <div class="top-row">
            
            <!-- LEFT: LIVE NEWS -->
            <div class="card">
                <h2><i class="fas fa-newspaper"></i> Global Feed</h2>
                
                <select id="newsCategory" onchange="getNews()">
                    <option value="general">General Intelligence</option>
                    <option value="technology">Tech & AI</option>
                    <option value="business">Market Data</option>
                    <option value="entertainment">Media Stream</option>
                </select>

                <div id="newsContent" class="news-grid">
                    <div class="loading-spinner">FETCHING_DATA...</div>
                </div>
            </div>

            <!-- RIGHT: MEDIA HUB (AUDIO/VIDEO) -->
            <div class="card">
                <h2><i class="fas fa-play-circle"></i> Media Hub</h2>
                
                <div class="media-tabs">
                    <button class="tab-btn active" onclick="switchMediaTab('video')">📺 Video</button>
                    <button class="tab-btn" onclick="switchMediaTab('audio')">🎵 Audio</button>
                </div>

                <div class="media-display-area" id="mediaDisplayArea">
                    <!-- Default Content Loaded via JS -->
                    <div class="loading-spinner">INITIALIZING_PLAYER...</div>
                </div>
            </div>

        </div>

        <!-- BOTTOM ROW: MOVIES DATABASE -->
        <div class="bottom-row card">
            <h2><i class="fas fa-film"></i> Cinema Database</h2>
            
            <div class="movie-controls">
                <input type="text"
                       id="movieSearch"
                       class="movie-search-input"
                       placeholder="Query title..."
                       onkeyup="if(event.key==='Enter') searchMovies()">
                <button onclick="searchMovies()" style="width: auto; padding: 12px 20px;">
                    Search
                </button>
            </div>

            <div id="movieResults" class="movie-grid">
                 <div class="loading-spinner">LOADING_TRENDING...</div>
            </div>
        </div>

    </div>

    <!-- VIDEO MODAL (For Movie Trailers) -->
    <div id="videoModal">
        <div class="modal-inner">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div id="videoPlayer" style="aspect-ratio:16/9; background:#000; border-radius:8px; overflow:hidden;">
            </div>
        </div>
    </div>

    <!-- NEWS MODAL -->
    <div id="newsModal">
        <div class="news-modal-inner">
            <button class="close-news-btn" onclick="closeNewsModal()">✕</button>
            <img id="newsModalImg" class="news-modal-img" alt="Article Image">
            <h2 id="newsModalTitle" style="margin-bottom:15px;color:var(--neon-cyan); font-family:'Orbitron', sans-serif;"></h2>
            <div id="newsModalContent" style="line-height:1.7;margin-bottom:20px;color:#ddd;">
            </div>
            <div style="padding:15px; background:rgba(0,0,0,0.3); border-radius:8px; border:1px solid rgba(255,255,255,0.05);">
                <p id="newsModalSource" style="font-size:0.85rem;color:var(--text-dim);margin-bottom:8px;"></p>
                <p id="newsModalDate" style="font-size:0.8rem;color:#64748b;"></p>
            </div>
        </div>
    </div>

<script>
    /* =========================
       CONFIGURATION
    ========================= */
    const API_KEY_MOVIE = "2a76ab20531de6848483abb62c0f0c50";
    let currentNewsData = [];
    
    // Your Real Media Links (From previous chats)
    const mediaLibrary = {
        video: [
            { title: "SDA Ministry 1", src: "https://www.youtube.com/embed/iD67VqeTdkE?rel=0&modestbranding=1" },
            { title: "Worship Session", src: "https://www.youtube.com/embed/_yV7zniQs4g?rel=0&modestbranding=1" }
        ],
        audio: [
            { title: "SDA Worship Playlist", src: "https://open.spotify.com/embed/playlist/5KpUf3Ys4G60aM8toOOh55?utm_source=generator&theme=0" },
            { title: "Classic Hymns", src: "https://open.spotify.com/embed/playlist/37i9dQZF1DXbmINI7suDts?utm_source=generator&theme=0" }
        ]
    };

    /* =========================
       PARTICLE NETWORK ANIMATION
    ========================= */
    const canvas = document.getElementById('network-canvas');
    const ctx = canvas.getContext('2d');
    let particlesArray;
    let w, h;

    function resize() {
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w;
        canvas.height = h;
        initParticles();
    }

    class Particle {
        constructor(x, y, directionX, directionY, size, color) {
            this.x = x; this.y = y;
            this.directionX = directionX; this.directionY = directionY;
            this.size = size; this.color = color;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
            ctx.fillStyle = this.color;
            ctx.fill();
        }
        update() {
            if (this.x > w || this.x < 0) this.directionX = -this.directionX;
            if (this.y > h || this.y < 0) this.directionY = -this.directionY;
            this.x += this.directionX;
            this.y += this.directionY;
            this.draw();
        }
    }

    function initParticles() {
        particlesArray = [];
        let numberOfParticles = (h * w) / 15000; 
        for (let i = 0; i < numberOfParticles; i++) {
            let size = (Math.random() * 2) + 1;
            let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
            let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
            let directionX = (Math.random() * 2) - 1;
            let directionY = (Math.random() * 2) - 1;
            let color = '#00f3ff'; 
            particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        for (let i = 0; i < particlesArray.length; i++) {
            particlesArray[i].update();
        }
        connectParticles();
    }

    function connectParticles() {
        let opacityValue = 1;
        for (let a = 0; a < particlesArray.length; a++) {
            for (let b = a; b < particlesArray.length; b++) {
                let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x))
                             + ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                if (distance < (w/10)*(h/10)) {
                    opacityValue = 1 - (distance/20000);
                    ctx.strokeStyle = `rgba(0, 243, 255, ${opacityValue})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                    ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                    ctx.stroke();
                }
            }
        }
    }

    window.addEventListener('resize', resize);
    resize();
    animate();


    /* =========================
       MEDIA HUB LOGIC (NEW)
    ========================= */
    function switchMediaTab(type) {
        // Update Buttons
        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        // Load Content
        const displayArea = document.getElementById('mediaDisplayArea');
        displayArea.innerHTML = '<div class="loading-spinner">BUFFERING...</div>';

        setTimeout(() => {
            if (type === 'video') {
                // Show first video by default
                const vid = mediaLibrary.video[0];
                displayArea.innerHTML = `<iframe src="${vid.src}" allowfullscreen></iframe>`;
            } else if (type === 'audio') {
                // Show first playlist by default
                const aud = mediaLibrary.audio[0];
                displayArea.innerHTML = `<iframe class="spotify-frame" src="${aud.src}" frameborder="0" allowtransparency="true" allow="encrypted-media"></iframe>`;
            }
        }, 300);
    }

    /* =========================
       LIVE NEWS LOGIC
    ========================= */
    async function getNews(){
        const cat = document.getElementById("newsCategory").value;
        const feeds = {
            general: "https://api.rss2json.com/v1/api.json?rss_url=https://feeds.bbci.co.uk/news/rss.xml",
            technology: "https://api.rss2json.com/v1/api.json?rss_url=https://feeds.bbci.co.uk/news/technology/rss.xml",
            business: "https://api.rss2json.com/v1/api.json?rss_url=http://feeds.reuters.com/reuters/businessNews",
            entertainment: "https://api.rss2json.com/v1/api.json?rss_url=https://feeds.skynews.com/feeds/rss/entertainment.xml"
        };

        try{
            const res = await fetch(feeds[cat]);
            const data = await res.json();
            currentNewsData = data.items || [];

            if(currentNewsData.length === 0){
                document.getElementById("newsContent").innerHTML = "<p style='color:var(--danger)'>NO SIGNAL DETECTED.</p>";
                return;
            }

            document.getElementById("newsContent").innerHTML = currentNewsData.map((n, idx) => `
                <div class="news-item" onclick="openNewsModal(${idx})">
                    <img src="${n.thumbnail || 'https://via.placeholder.com/150/000000/00f3ff?text=NB'}" class="news-item-img" alt="Thumb">
                    <div class="news-item-content">
                        <h4>${n.title || 'Untitled'}</h4>
                        <p>${(n.description || '').replace(/<[^>]*>?/gm, '').substring(0, 100)}...</p>
                        <span class="source-tag">${n.author || 'BBC'}</span>
                    </div>
                </div>
            `).join("");

        } catch(err){
            console.error("News fetch error:", err);
            document.getElementById("newsContent").innerHTML = "<p style='color:var(--danger)'>CONNECTION FAILED.</p>";
        }
    }

    function openNewsModal(index){
        const news = currentNewsData[index];
        document.getElementById("newsModalImg").src = news.thumbnail || "https://via.placeholder.com/800x400/000000/00f3ff?text=GUARDIAN+NEWS";
        document.getElementById("newsModalTitle").textContent = news.title;
        document.getElementById("newsModalContent").innerHTML = `
            <p style="margin-bottom:20px;">${news.description || 'No description available.'}</p>
            <a href="${news.link || '#'}" target="_blank" class="read-full-btn">Access Full Archive ↗</a>
        `;
        document.getElementById("newsModalSource").textContent = `SOURCE: ${news.author || 'UNKNOWN'}`;
        document.getElementById("newsModalDate").textContent = `TIMESTAMP: ${news.pubDate || 'N/A'}`;
        document.getElementById("newsModal").style.display = "flex";
    }

    function closeNewsModal(){
        document.getElementById("newsModal").style.display = "none";
    }

    /* =========================
       MOVIES LOGIC
    ========================= */
    async function searchMovies(){
        const query = document.getElementById("movieSearch").value;
        const url = query
            ? `https://api.themoviedb.org/3/search/movie?api_key=${API_KEY_MOVIE}&query=${encodeURIComponent(query)}`
            : `https://api.themoviedb.org/3/trending/movie/week?api_key=${API_KEY_MOVIE}`;

        try{
            const res = await fetch(url);
            const data = await res.json();

            if(!data.results || data.results.length === 0){
                document.getElementById("movieResults").innerHTML = "<p style='color:var(--warning)'>NO MATCHES FOUND.</p>";
                return;
            }

            document.getElementById("movieResults").innerHTML = data.results.slice(0, 12).map(m => `
                <div class="movie-item" onclick="playTrailer(${m.id})">
                    <img src="${m.poster_path ? 'https://image.tmdb.org/t/p/w200' + m.poster_path : 'https://via.placeholder.com/200x300/000000/00f3ff?text=NO+POSTER'}" alt="${m.title}">
                    <div class="movie-title-overlay">${m.title || 'Unknown'}</div>
                </div>
            `).join("");

        } catch(err){
            console.error("Movie fetch error:", err);
            document.getElementById("movieResults").innerHTML = "<p style='color:var(--danger)'>DB ERROR.</p>";
        }
    }

    async function playTrailer(id){
        try{
            const res = await fetch(`https://api.themoviedb.org/3/movie/${id}/videos?api_key=${API_KEY_MOVIE}`);
            const data = await res.json();
            const trailer = data.results && data.results.find(v => v.type === "Trailer" && v.site === "YouTube");

            if(trailer){
                document.getElementById("videoPlayer").innerHTML = `
                    <iframe width="100%" height="100%" src="https://www.youtube.com/embed/${trailer.key}?autoplay=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                `;
                document.getElementById("videoModal").style.display = "flex";
            } else {
                alert("TRAILER_NOT_FOUND.EXE");
            }
        } catch(err){
            console.error("Trailer fetch error:", err);
            alert("STREAM_ERROR.EXE");
        }
    }

    function closeModal(){
        document.getElementById("videoModal").style.display = "none";
        document.getElementById("videoPlayer").innerHTML = "";
    }

    /* =========================
       INITIALIZATION
    ========================= */
    window.onload = () => {
        getNews();
        searchMovies();
        switchMediaTab('video'); // Start with Video tab active
    };
</script>

</body>
</html>
