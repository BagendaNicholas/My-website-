<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guardian OS | Media Console</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
    /* --- GUARDIAN VARIABLES --- */
    :root {
        --bg-deep: #050505;
        --neon-cyan: #00f3ff;
        --neon-purple: #bc13fe;
        --glass-bg: rgba(15, 15, 20, 0.7);
        --border-color: rgba(0, 243, 255, 0.2);
        --text-main: #ffffff;
        --text-dim: #a0a0a0;
        --success: #00ff64;
        --danger: #ff3232;
    }

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        cursor: crosshair;
    }

    body{
        background:#050505;
        color:#fff;
        font-family:'Poppins',sans-serif;
        min-height:100vh;
        padding:20px;
        position:relative;
        overflow-x:hidden;
    }

    /* BACKGROUND CANVAS LAYER */
    #network-canvas {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: -1;
        opacity: 0.3;
        pointer-events: none;
    }

    /* HEADER */
    .header{
        text-align:center;
        margin-bottom:30px;
        position:relative;
        z-index: 1;
    }

    .header h1{
        font-family:'Orbitron', sans-serif;
        font-size:2.5rem;
        margin-bottom:8px;
        color:var(--neon-cyan);
        text-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    .header p{
        color:var(--text-dim);
        font-size: 0.9rem;
        letter-spacing: 1px;
    }

    /* MAIN GRID LAYOUT */
    .console-grid {
        max-width: 1400px;
        margin: auto;
        display: grid;
        grid-template-columns: 1fr 1.5fr; /* Music takes less space, Movies take more */
        gap: 25px;
        position: relative;
        z-index: 1;
    }

    /* CARDS */
    .card{
        background:var(--glass-bg);
        border-radius:16px;
        padding:25px;
        backdrop-filter:blur(12px);
        border:1px solid var(--border-color);
        transition: all 0.3s ease;
        position:relative;
        overflow:hidden;
        display:flex;
        flex-direction:column;
        height: 100%;
    }

    .card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 2px;
        background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
        opacity: 0.5;
    }

    .card:hover {
        border-color: var(--neon-cyan);
        box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);
        transform: translateY(-5px);
    }

    h2{
        font-family:'Orbitron', sans-serif;
        margin-bottom:20px;
        display:flex;
        align-items:center;
        gap:10px;
        color:white;
        font-size: 1.2rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 10px;
    }

    h2 i {
        color: var(--neon-cyan);
    }

    /* INPUTS & BUTTONS */
    input, select{
        width:100%;
        padding:12px;
        border:1px solid rgba(255,255,255,0.1);
        border-radius:8px;
        background:rgba(0,0,0,0.3);
        color:white;
        margin-bottom:15px;
        font-family: 'Poppins', sans-serif;
        transition: 0.3s;
    }

    input:focus, select:focus {
        outline:none;
        border-color: var(--neon-cyan);
        box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        background: rgba(0,0,0,0.5);
    }

    button{
        padding:12px;
        border:none;
        border-radius:8px;
        background:transparent;
        border:1px solid var(--neon-cyan);
        color:var(--neon-cyan);
        cursor:pointer;
        font-weight:bold;
        font-family:'Orbitron', sans-serif;
        text-transform:uppercase;
        letter-spacing:1px;
        transition:0.3s;
        width:100%;
        position:relative;
        overflow:hidden;
    }

    button:hover{
        background:var(--neon-cyan);
        color:black;
        box-shadow: 0 0 15px var(--neon-cyan);
    }

    /* LEFT COLUMN: WORLD MUSIC PLAYER */
    .music-player-container {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .playlist-selector {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 10px;
    }

    .genre-btn {
        padding: 6px 12px;
        font-size: 0.75rem;
        border-radius: 20px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        color: var(--text-dim);
        cursor: pointer;
        transition: 0.3s;
        font-family: 'Poppins', sans-serif;
        text-transform: none;
        letter-spacing: normal;
    }

    .genre-btn:hover, .genre-btn.active {
        background: var(--neon-purple);
        color: white;
        border-color: var(--neon-purple);
        box-shadow: 0 0 10px rgba(188, 19, 254, 0.4);
    }

    .spotify-frame-wrapper {
        flex-grow: 1;
        background: #000;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.05);
        min-height: 400px; /* Ensure player has height */
        position: relative;
    }

    .spotify-frame-wrapper iframe {
        width: 100%;
        height: 100%;
        border: none;
    }

    /* RIGHT COLUMN: CINEMA DATABASE */
    .movie-controls {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }
    
    .movie-search-input {
        flex-grow: 1;
        margin-bottom: 0 !important;
    }

    .movie-grid{
        display:grid;
        grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
        gap:15px;
        margin-top:10px;
        max-height:600px;
        overflow-y:auto;
        padding-bottom: 10px;
    }

    /* Custom Scrollbar for Movie Grid */
    .movie-grid::-webkit-scrollbar { width: 6px; }
    .movie-grid::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .movie-grid::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 3px; }

    .movie-item{
        background:rgba(0,0,0,0.3);
        border-radius:8px;
        overflow:hidden;
        cursor:pointer;
        transition:0.3s;
        border:1px solid transparent;
        position:relative;
        aspect-ratio: 2/3;
    }

    .movie-item:hover{
        border-color: var(--neon-purple);
        transform: scale(1.05);
        box-shadow: 0 0 15px rgba(188, 19, 254, 0.3);
        z-index: 2;
    }

    .movie-item img{
        width:100%;
        height:100%;
        object-fit:cover;
        display:block;
    }

    .movie-title-overlay {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        padding: 15px 10px 10px;
        color: white;
        font-size: 0.8rem;
        font-weight: 600;
        text-align: center;
        opacity: 0;
        transition: 0.3s;
        height: 100%;
        display: flex;
        align-items: flex-end;
        justify-content: center;
    }

    .movie-item:hover .movie-title-overlay {
        opacity: 1;
    }

    /* MODALS */
    #videoModal {
        display:none;
        position:fixed;
        top:0; left:0;
        width:100%; height:100%;
        background:rgba(0,0,0,0.95);
        backdrop-filter: blur(10px);
        z-index:2000;
        justify-content:center;
        align-items:center;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-inner{
        width:90%;
        max-width:900px;
        position:relative;
        background:var(--glass-bg);
        border:1px solid var(--border-color);
        border-radius:16px;
        padding:20px;
        box-shadow: 0 0 50px rgba(0, 243, 255, 0.2);
    }

    .close-btn{
        position:absolute;
        top:-15px; right:-15px;
        background:var(--danger);
        color:white;
        width:40px; height:40px;
        border-radius:50%;
        border:none;
        cursor:pointer;
        font-size:1.2rem;
        display:flex;
        align-items:center;
        justify-content:center;
        box-shadow: 0 0 10px var(--danger);
        transition: 0.3s;
        z-index: 10;
    }

    .close-btn:hover {
        transform: rotate(90deg) scale(1.1);
        background: #ff0000;
    }

    /* LOADING STATES */
    .loading-spinner {
        text-align: center;
        padding: 20px;
        color: var(--neon-cyan);
        font-family: 'Orbitron', sans-serif;
        animation: blink 1s infinite;
    }
    @keyframes blink { 50% { opacity: 0.5; } }

    /* Responsive Adjustments */
    @media (max-width: 900px) {
        .console-grid {
            grid-template-columns: 1fr; /* Stack vertically on mobile/tablet */
        }
        .spotify-frame-wrapper {
            min-height: 300px;
        }
    }
</style>
</head>

<body>

    <!-- Living Background Canvas -->
    <canvas id="network-canvas"></canvas>

    <div class="header">
        <h1><i class="fas fa-satellite-dish"></i> Guardian Console</h1>
        <p>// GLOBAL_AUDIO_STREAM // CINEMA_DATABASE</p>
    </div>

    <div class="console-grid">

        <!-- LEFT: WORLD MUSIC PLAYER -->
        <div class="card">
            <h2><i class="fas fa-music"></i> World Frequencies</h2>
            
            <div class="music-player-container">
                <!-- Genre Selector -->
                <div class="playlist-selector" id="genreSelector">
                    <button class="genre-btn active" onclick="loadPlaylist('global_hits')">🌍 Global Hits</button>
                    <button class="genre-btn" onclick="loadPlaylist('chill_vibes')">🎧 Chill Vibes</button>
                    <button class="genre-btn" onclick="loadPlaylist('rock_classics')">🎸 Rock Legends</button>
                    <button class="genre-btn" onclick="loadPlaylist('electronic_pulse')">⚡ Electronic</button>
                </div>

                <!-- The Player Frame -->
                <div class="spotify-frame-wrapper" id="playerWrapper">
                    <iframe 
                        id="spotifyPlayer"
                        src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M?utm_source=generator&theme=0" 
                        frameborder="0" 
                        allowtransparency="true" 
                        allow="encrypted-media">
                    </iframe>
                </div>
            </div>
        </div>

        <!-- RIGHT: CINEMA DATABASE -->
        <div class="card">
            <h2><i class="fas fa-film"></i> Cinema DB</h2>
            
            <div class="movie-controls">
                <input type="text"
                       id="movieSearch"
                       class="movie-search-input"
                       placeholder="Query title..."
                       onkeyup="if(event.key==='Enter') searchMovies()">
                <button onclick="searchMovies()" style="width: auto; padding: 12px 20px;">
                    Search
                </button>
            </div>

            <div id="movieResults" class="movie-grid">
                 <div class="loading-spinner">LOADING_TRENDING...</div>
            </div>
        </div>

    </div>

    <!-- VIDEO MODAL (For Movie Trailers) -->
    <div id="videoModal">
        <div class="modal-inner">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div id="videoPlayer" style="aspect-ratio:16/9; background:#000; border-radius:8px; overflow:hidden;">
            </div>
        </div>
    </div>

<script>
    /* =========================
       CONFIGURATION
    ========================= */
    const API_KEY_MOVIE = "2a76ab20531de6848483abb62c0f0c50";
    
    // Map genres to Spotify Playlist IDs (Public Charts)
    const spotifyPlaylists = {
        global_hits: "37i9dQZF1DXcBWIGoYBM5M", // Today's Top Hits
        chill_vibes: "37i9dQZF1DWWEJlAGA9gs0", // Chill Hits
        rock_classics: "37i9dQZF1DX0XUsuxWHRQd", // Rock Classics
        electronic_pulse: "37i9dQZF1DX4dyzvuaRJ0n" // Mint (Electronic)
    };

    /* =========================
       PARTICLE NETWORK ANIMATION
    ========================= */
    const canvas = document.getElementById('network-canvas');
    const ctx = canvas.getContext('2d');
    let particlesArray;
    let w, h;

    function resize() {
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w;
        canvas.height = h;
        initParticles();
    }

    class Particle {
        constructor(x, y, directionX, directionY, size, color) {
            this.x = x; this.y = y;
            this.directionX = directionX; this.directionY = directionY;
            this.size = size; this.color = color;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
            ctx.fillStyle = this.color;
            ctx.fill();
        }
        update() {
            if (this.x > w || this.x < 0) this.directionX = -this.directionX;
            if (this.y > h || this.y < 0) this.directionY = -this.directionY;
            this.x += this.directionX;
            this.y += this.directionY;
            this.draw();
        }
    }

    function initParticles() {
        particlesArray = [];
        let numberOfParticles = (h * w) / 15000; 
        for (let i = 0; i < numberOfParticles; i++) {
            let size = (Math.random() * 2) + 1;
            let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
            let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
            let directionX = (Math.random() * 2) - 1;
            let directionY = (Math.random() * 2) - 1;
            let color = '#00f3ff'; 
            particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        for (let i = 0; i < particlesArray.length; i++) {
            particlesArray[i].update();
        }
        connectParticles();
    }

    function connectParticles() {
        let opacityValue = 1;
        for (let a = 0; a < particlesArray.length; a++) {
            for (let b = a; b < particlesArray.length; b++) {
                let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x))
                             + ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                if (distance < (w/10)*(h/10)) {
                    opacityValue = 1 - (distance/20000);
                    ctx.strokeStyle = `rgba(0, 243, 255, ${opacityValue})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                    ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                    ctx.stroke();
                }
            }
        }
    }

    window.addEventListener('resize', resize);
    resize();
    animate();


    /* =========================
       WORLD MUSIC LOGIC
    ========================= */
    function loadPlaylist(genreKey) {
        // Update Active Button Style
        const buttons = document.querySelectorAll('.genre-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        // Get Playlist ID
        const playlistId = spotifyPlaylists[genreKey];
        
        // Construct Embed URL
        const embedUrl = `https://open.spotify.com/embed/playlist/${playlistId}?utm_source=generator&theme=0`;
        
        // Swap Iframe Source
        const playerFrame = document.getElementById('spotifyPlayer');
        playerFrame.src = embedUrl;
    }

    /* =========================
       MOVIES LOGIC
    ========================= */
    async function searchMovies(){
        const query = document.getElementById("movieSearch").value;
        const url = query
            ? `https://api.themoviedb.org/3/search/movie?api_key=${API_KEY_MOVIE}&query=${encodeURIComponent(query)}`
            : `https://api.themoviedb.org/3/trending/movie/week?api_key=${API_KEY_MOVIE}`;

        try{
            const res = await fetch(url);
            const data = await res.json();

            if(!data.results || data.results.length === 0){
                document.getElementById("movieResults").innerHTML = "<p style='color:var(--warning)'>NO MATCHES FOUND.</p>";
                return;
            }

            document.getElementById("movieResults").innerHTML = data.results.slice(0, 12).map(m => `
                <div class="movie-item" onclick="playTrailer(${m.id})">
                    <img src="${m.poster_path ? 'https://image.tmdb.org/t/p/w200' + m.poster_path : 'https://via.placeholder.com/200x300/000000/00f3ff?text=NO+POSTER'}" alt="${m.title}">
                    <div class="movie-title-overlay">${m.title || 'Unknown'}</div>
                </div>
            `).join("");

        } catch(err){
            console.error("Movie fetch error:", err);
            document.getElementById("movieResults").innerHTML = "<p style='color:var(--danger)'>DB ERROR.</p>";
        }
    }

    async function playTrailer(id){
        try{
            const res = await fetch(`https://api.themoviedb.org/3/movie/${id}/videos?api_key=${API_KEY_MOVIE}`);
            const data = await res.json();
            const trailer = data.results && data.results.find(v => v.type === "Trailer" && v.site === "YouTube");

            if(trailer){
                document.getElementById("videoPlayer").innerHTML = `
                    <iframe width="100%" height="100%" src="https://www.youtube.com/embed/${trailer.key}?autoplay=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                `;
                document.getElementById("videoModal").style.display = "flex";
            } else {
                alert("TRAILER_NOT_FOUND.EXE");
            }
        } catch(err){
            console.error("Trailer fetch error:", err);
            alert("STREAM_ERROR.EXE");
        }
    }

    function closeModal(){
        document.getElementById("videoModal").style.display = "none";
        document.getElementById("videoPlayer").innerHTML = "";
    }

    /* =========================
       INITIALIZATION
    ========================= */
    window.onload = () => {
        searchMovies(); // Load trending movies by default
        // Music loads via default iframe src in HTML
    };
</script>

</body>
</html>
